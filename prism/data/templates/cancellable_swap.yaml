meta:
  name: "Отменяемый (cancellable) своп"
  asset_class: rate
  group: "Процентные"
  description: "Своп со встроенным правом банка прекратить его — встроенный бермудский свопцион, часто не раскрываемый отдельно."
  params:
    trade_id: {type: str, default: "CAN-001"}
    client: {type: str, default: "CLIENT_METAL"}
    notional: {type: float, default: 1000000000}
    fixed_rate: {type: float, default: 0.13}
    start: {type: date, default: "2026-10-16"}
    years: {type: int, default: 5}
    holder: {type: str, default: "bank", choices: [bank, client]}
trade: |
  identification: {trade_id: "{{ trade_id }}", client: "{{ client }}", bank: BANK_DEMO, trade_date: "2026-10-15"}
  product: "Отменяемый IRS на КС {{ years }}Y (право прекращения у {{ 'банка' if holder == 'bank' else 'клиента' }})"
  purpose: {type: pay_floating}
  underlyings: {KS: {asset_class: rate, id: KEYRATE}}
  modifiers:
    - type: early_termination
      holder: "{{ holder }}"
      amount: 0.0
      dates:
  {% for k in range(1, years) %}
        - "{{ add_months(start, 12*k)|d }}"
  {% endfor %}
  legs:
    - name: fixed
      underlying: KS
      schedule: {start: "{{ start|d }}", end: "{{ add_months(start, 12*years)|d }}", frequency: 1Y, calendar: RU}
      notional: {currency: RUB, amount: {{ notional }}}
      components: [{kind: fixed, rate: {{ fixed_rate }}, position: short}]
    - name: float
      underlying: KS
      schedule: {start: "{{ start|d }}", end: "{{ add_months(start, 12*years)|d }}", frequency: 1Y, calendar: RU}
      notional: {currency: RUB, amount: {{ notional }}}
      components: [{kind: float, position: long}]

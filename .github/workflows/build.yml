name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: System libraries for Qt
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  windows:
    name: Windows build (.exe + installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import mindforge; print(mindforge.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build portable MindForge.exe
        run: python -m PyInstaller MindForge.spec --noconfirm

      - name: Self-test portable exe
        shell: pwsh
        run: |
          $report = Join-Path $PWD "selftest-portable.json"
          $p = Start-Process -FilePath "dist\MindForge.exe" -ArgumentList "--selftest=$report" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "Self-test timed out" }
          Get-Content $report -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Build folder version (for installer)
        env:
          MINDFORGE_ONEDIR: "1"
        run: python -m PyInstaller MindForge.spec --noconfirm

      - name: Self-test folder version
        shell: pwsh
        run: |
          $report = Join-Path $PWD "selftest-onedir.json"
          $p = Start-Process -FilePath "dist\MindForge\MindForge.exe" -ArgumentList "--selftest=$report" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "Self-test timed out" }
          Get-Content $report -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\MindForge.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MindForge-${{ steps.ver.outputs.version }}-windows
          path: |
            dist/MindForge.exe
            dist/MindForge-Setup-*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MindForge.exe
            dist/MindForge-Setup-*.exe

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-otc"
version = "0.1.0"
description = "Prism — независимый прайсер внебиржевых деривативов российского рынка с разложением цены"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
benchmark = ["QuantLib>=1.30"]
dev = ["pytest>=8", "QuantLib>=1.30", "fastapi>=0.110", "httpx>=0.27"]

[project.scripts]
prism = "prism.cli:main"

[tool.setuptools.packages.find]
include = ["prism*"]

[tool.setuptools.package-data]
prism = ["data/**/*", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: долгие тесты (Монте-Карло, полные прогоны)",
    "quantlib: сверка с QuantLib",
]

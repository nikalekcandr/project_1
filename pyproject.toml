[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finradar"
version = "0.1.0"
description = "Агрегатор вакансий и возможностей в финансах, экономике и аналитике (RU + global) с дедупликацией, скорингом и аналитикой рынка"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
finradar = "finradar.cli:main"

[tool.setuptools.packages.find]
include = ["finradar*"]

[tool.setuptools.package-data]
finradar = ["templates/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

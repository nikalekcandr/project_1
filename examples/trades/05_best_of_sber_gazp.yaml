# корреляции SBER–GAZP выше, чем к волатильности — см. блок «корреляция» в греках.
identification: {trade_id: BO-EQ-01, client: CLIENT_METAL, bank: BANK_DEMO, trade_date: "2026-10-15"}
product: "Best-of колл SBER/GAZP, участие ограничено +40%"
purpose: {type: investment}
underlyings:
  A: {asset_class: equity, id: SBER, fixing: {source: MOEX}}
  B: {asset_class: equity, id: GAZP, fixing: {source: MOEX}}
model: {paths: 30000}
legs:

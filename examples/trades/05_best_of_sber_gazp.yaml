    observable: {type: basket, names: [A, B], rule: best_of, performance: true}
    currency: RUB
    schedule: {start: "2026-10-15", dates: ["2027-10-15"], calendar: RU, payment_lag: 2}
    notional: {currency: RUB, amount: 100000000}
    components: [{kind: call, strike: 1.0, cap_strike: 1.4}]
